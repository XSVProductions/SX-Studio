name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:AIM_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc windows\aim_movers.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac installer
        run: |
          VER=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && VER="${GITHUB_REF_NAME#v}"
          bash mac/build_pkg.sh "$VER"
      - name: Smoke test (install the pkg, start the app's server, call it)
        run: |
          sudo installer -pkg build/mac/*.pkg -target /
          A="/Applications/ShowXpress Helper.app/Contents"
          ls -l "$A/MacOS" "$A/Resources"
          test -x "$A/MacOS/run" && test -x "$A/Resources/sync_from_windows.sh" && test -f "$A/Resources/AppIcon.icns"
          pwsh -NoProfile -File "$A/Resources/df_aim_gui.ps1" -NoBrowser -Port 47390 > /tmp/gui.log 2>&1 &
          sleep 8
          URL="$(pwsh -NoProfile -c '(Get-Content (Join-Path ([IO.Path]::GetTempPath()) "showxpress_helper_gui.json") -Raw | ConvertFrom-Json).url')"
          TOK="${URL##*t=}"
          curl -fsS "http://localhost:47390/?t=$TOK" | grep -q "ShowXpress Helper"
          curl -fsS "http://localhost:47390/api/sx?t=$TOK"; echo
          # no show on the build machine -> expect the friendly "run SYNC FROM WINDOWS" message from the engine
          curl -fsS "http://localhost:47390/api/preview?t=$TOK" | tee /tmp/p.json; echo
          grep -q "SYNC FROM WINDOWS" /tmp/p.json
          curl -fsS "http://localhost:47390/api/skip?t=$TOK" | tee /tmp/s.json; echo
          grep -q "SYNC FROM WINDOWS" /tmp/s.json
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:47390/api/sx?t=wrong")" = 403
          cat /tmp/gui.log
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac/*.pkg

  release:
    if: github.ref_type == 'tag'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ShowXpress Helper $GITHUB_REF_NAME" \
            --notes "Windows: download the .exe and run it. Mac: download the .pkg and open it. See the README for first-run notes."
