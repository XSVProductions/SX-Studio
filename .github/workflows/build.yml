name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Windows installer
        shell: pwsh
        run: |
          $env:AIM_VERSION = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          [IO.File]::WriteAllText("$PWD\src\version.txt", $env:AIM_VERSION)
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc windows\aim_movers.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
      - name: Smoke test (Windows PowerShell 5.1, phone / iPad over the Wi-Fi relay)
        shell: powershell
        run: |
          $T = Join-Path $env:RUNNER_TEMP 'sxh_phone'; New-Item -ItemType Directory -Force $T | Out-Null
          [IO.File]::WriteAllText("$T\phone.json", '{"on":true,"key":"ci0key0ci0key"}')
          $gui = Start-Process powershell.exe -ArgumentList '-NoProfile','-ExecutionPolicy','Bypass','-File',"$PWD\src\df_aim_gui.ps1",'-NoBrowser','-Port','47392','-PhonePort','47393','-TestRoot',$T -PassThru -RedirectStandardError "$T\err.log"
          $P = 'http://127.0.0.1:47393'
          function Code($u, $body) { try { if ($body) { (Invoke-WebRequest $u -Method Post -Body $body -ContentType 'text/plain' -UseBasicParsing).StatusCode } else { (Invoke-WebRequest $u -UseBasicParsing).StatusCode } } catch { [int]$_.Exception.Response.StatusCode } }
          for ($i = 0; $i -lt 40 -and (Code "$P/") -ne 200; $i++) { Start-Sleep 1 }
          $fail = @()
          if ((Invoke-WebRequest "$P/" -UseBasicParsing).Content -notmatch 'Connect to the laptop') { $fail += 'phone page' }
          if ((Code "$P/api/sx") -ne 403) { $fail += 'no key not refused' }
          if ((Invoke-WebRequest "$P/api/sx?t=ci0key0ci0key" -UseBasicParsing).Content -notmatch '"open"') { $fail += 'key refused' }
          if ((Code "$P/api/phone?t=ci0key0ci0key") -ne 403) { $fail += 'computer-only route open' }
          if ((Invoke-WebRequest "$P/api/phone/pair" -Method Post -Body '{"pin":"000000"}' -ContentType 'text/plain' -UseBasicParsing).Content -notmatch '"ok":false') { $fail += 'pairing without a code' }
          if ((Code "$P/api/live/out?t=ci0key0ci0key" '{"l":"k"}') -ne 200) { $fail += 'POST through the relay' }
          Get-Content "$T\err.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $gui.Id -Force -ErrorAction SilentlyContinue
          if ($fail.Count) { throw ('Phone relay: ' + ($fail -join ', ')) }
          'Phone relay OK'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac installer
        run: |
          VER=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && VER="${GITHUB_REF_NAME#v}"
          printf '%s' "$VER" > src/version.txt
          bash mac/build_pkg.sh "$VER"
      - name: Smoke test (install the pkg, start the app's server, call it)
        run: |
          sudo installer -pkg build/mac/*.pkg -target /
          A="/Applications/ShowXpress Helper.app/Contents"
          ls -l "$A/MacOS" "$A/Resources"
          test -x "$A/MacOS/ShowXpressHelper" && test -f "$A/Resources/launch.sh" && test -x "$A/MacOS/sxh_dmx" && lipo "$A/MacOS/ShowXpressHelper" -verify_arch x86_64 arm64 && test -f "$A/Resources/AppIcon.icns" && test -f "$A/Resources/color.ps1" && test -f "$A/Resources/gdrive.ps1" && test -f "$A/Resources/sx_remote.ps1" && test -f "$A/Resources/version.txt"
          test ! -e "$A/Resources/sync_from_windows.sh"
          pwsh -NoProfile -File "$A/Resources/df_aim_gui.ps1" -NoBrowser -Port 47390 > /tmp/gui.log 2>&1 &
          sleep 8
          URL="$(pwsh -NoProfile -c '(Get-Content (Join-Path ([IO.Path]::GetTempPath()) "showxpress_helper_gui.json") -Raw | ConvertFrom-Json).url')"
          TOK="${URL##*t=}"
          curl -fsS "http://localhost:47390/?t=$TOK" | grep -q "ShowXpress Helper"
          curl -fsS "http://localhost:47390/api/sx?t=$TOK"; echo
          # no show on the build machine -> expect the friendly "show folder not found" message from every engine
          for EP in preview "preview?mode=room" skip rig apc speed health color gdrive; do
            curl -fsS "http://localhost:47390/api/$EP$( [[ $EP == *\?* ]] && echo '&' || echo '?' )t=$TOK" | tee /tmp/e.json; echo; grep -q "show_path.txt" /tmp/e.json; done
          curl -fsS "http://localhost:47390/api/update?t=$TOK"; echo
          test "$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:47390/api/sx?t=wrong")" = 403
          cat /tmp/gui.log
      - name: Smoke test (open the app itself, it starts its server and shows it)
        run: |
          pkill -f "df_aim_gui.ps1 -NoBrowser -Port 47390" || true
          open "/Applications/ShowXpress Helper.app"
          L="$HOME/AwaazTools/showxpress_helper_app.log"
          for i in $(seq 90); do grep -q "loaded http://localhost:47321" "$L" 2>/dev/null && break; sleep 1; done
          cat "$L" || true; cat "$HOME/AwaazTools/showxpress_helper_error.log" 2>/dev/null || true
          grep -q "loaded http://localhost:47321" "$L"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:47321/)" = 403
          pgrep -f "ShowXpress Helper.app/Contents/MacOS/ShowXpressHelper"
          osascript -e 'quit app id "io.github.aimmovers.app"' || true
      - name: Smoke test (phone / iPad over the Wi-Fi relay)
        run: |
          A="/Applications/ShowXpress Helper.app/Contents"
          T="$(mktemp -d)"; printf '{"on":true,"key":"ci0key0ci0key"}' > "$T/phone.json"
          pwsh -NoProfile -File "$A/Resources/df_aim_gui.ps1" -NoBrowser -Port 47392 -PhonePort 47393 -TestRoot "$T" > /tmp/gui2.log 2>&1 &
          for i in $(seq 40); do curl -s -o /dev/null "http://127.0.0.1:47393/" && break; sleep 1; done
          P=http://127.0.0.1:47393
          curl -fsS "$P/" | grep -q "Connect to the laptop"                                        # phone page, served through the relay
          test "$(curl -s -o /dev/null -w '%{http_code}' "$P/api/sx")" = 403                         # no key -> refused
          test "$(curl -s -o /dev/null -w '%{http_code}' "$P/api/sx?t=wrong")" = 403
          curl -fsS "$P/api/sx?t=ci0key0ci0key" | tee /tmp/p.json; echo; grep -q '"open"' /tmp/p.json   # key -> works
          test "$(curl -s -o /dev/null -w '%{http_code}' "$P/api/phone?t=ci0key0ci0key")" = 403        # computer-only routes
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST --data '{}' "$P/api/update/install?t=ci0key0ci0key")" = 403
          curl -fsS -X POST -H 'Content-Type: text/plain' --data '{"pin":"000000"}' "$P/api/phone/pair" | tee /tmp/p.json; echo
          grep -q '"ok":false' /tmp/p.json                                                         # no code showing -> no pairing
          curl -fsS -X POST -H 'Content-Type: text/plain' --data '{"l":"k"}' "$P/api/live/out?t=ci0key0ci0key"; echo   # POST body through the relay
          IP="$(ipconfig getifaddr en0 2>/dev/null || true)"
          if [ -n "$IP" ]; then curl -fsS "http://$IP:47393/api/sx?t=ci0key0ci0key" | grep -q '"open"'; fi   # from the network side too
          cat /tmp/gui2.log
          pkill -f "df_aim_gui.ps1 -NoBrowser -Port 47392" || true
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac/*.pkg

  # live aim on the Mac uses ShowXpress's own driver (efk_hardware.dylib, Intel only): check it loads and runs
  # (no interface on the build machine -> "ERR none"). Informational: never blocks a release.
  mac_live_probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Load ShowXpress's Mac interface driver
        run: |
          curl -fsSL -o /tmp/sx.dmg https://download.thelightingcontroller.com/software/V9/ShowXpress/ShowXpress_Mac.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sxv /tmp/sx.dmg
          D="$(dirname "$(find /tmp/sxv -maxdepth 4 -name efk_hardware.dylib | head -n 1)")"
          cp -R "$D" /tmp/sxapp; hdiutil detach /tmp/sxv
          ls /tmp/sxapp; lipo -archs /tmp/sxapp/efk_hardware.dylib
          [ "$(uname -m)" = arm64 ] && { softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true; }
          xcrun swiftc -O -target x86_64-apple-macos10.15 mac/dmx/main.swift -o /tmp/sxh_dmx
          /tmp/sxh_dmx --dir /tmp/sxapp --probe | tee /tmp/probe.txt
          grep -q "^ERR none" /tmp/probe.txt
          # the real protocol, with no interface: it must answer and exit cleanly
          printf 'z\nq\n' | /tmp/sxh_dmx --dir /tmp/sxapp

  release:
    if: github.ref_type == 'tag'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "ShowXpress Helper $GITHUB_REF_NAME" \
              --notes "Windows: download the .exe and run it. Mac: download the .pkg and open it. See the README for first-run notes."
          fi
