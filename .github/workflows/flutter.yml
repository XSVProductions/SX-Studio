name: Flutter app

# Tests and builds the Flutter port in flutter/. It never publishes: releases are signed and uploaded from the
# maintainer's computer (flutter/RELEASE_SETUP.md). It answers flutter-v* tags so it can't meet build.yml, which
# publishes the PowerShell app on v* tags. flutter/RELEASE_SETUP.md says when and how the two swap.
on:
  push:
    tags: ['flutter-v*']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: flutter

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # the old-versus-new checks need a real show folder, which is never in git, so they skip themselves here
      - name: Tests
        shell: pwsh
        run: |
          Push-Location packages\sx_release; dart pub get; dart test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
          Push-Location packages\sx_engine; dart pub get; dart test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
          Push-Location ui; flutter test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME -replace '^(flutter-)?v', '' } else { '0.0.0' }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          ui\tool\release.ps1 -Version $ver -NoSign
      - name: Smoke test (install it, open the app, call its engine)
        shell: pwsh
        run: ui\windows\installer\smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: flutter/build/windows/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tests
        run: |
          (cd packages/sx_engine && dart pub get && dart test)
          (cd ui && flutter test)
      - name: Build Mac installer
        run: |
          VER=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && { VER="${GITHUB_REF_NAME#flutter-}"; VER="${VER#v}"; }
          bash packaging/mac/build_pkg.sh "$VER"
      - name: Smoke test (install the pkg, open the app, call its engine)
        run: bash packaging/mac/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: flutter/build/mac/*.pkg

  # live output on the Mac uses ShowXpress's own driver (efk_hardware.dylib, one download per chip): check each
  # loads and runs on its chip (no interface on the build machine -> "ERR none"). Informational: never blocks a release.
  mac_live_probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Load ShowXpress's Mac interface driver
        run: |
          DMG=ShowXpress_Mac.dmg; TARGET=x86_64-apple-macos10.15
          [ "$(uname -m)" = arm64 ] && { DMG=ShowXpress_Mac_arm.dmg; TARGET=arm64-apple-macos11; }
          curl -fsSL -o /tmp/sx.dmg "https://download.thelightingcontroller.com/software/V9/ShowXpress/$DMG"
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sxv /tmp/sx.dmg
          D="$(dirname "$(find /tmp/sxv -maxdepth 4 -name efk_hardware.dylib | head -n 1)")"
          cp -R "$D" /tmp/sxapp; hdiutil detach /tmp/sxv
          ls /tmp/sxapp; lipo -archs /tmp/sxapp/efk_hardware.dylib
          xcrun swiftc -O -target "$TARGET" packaging/mac/dmx/main.swift -o /tmp/sxh_dmx
          /tmp/sxh_dmx --dir /tmp/sxapp --probe | tee /tmp/probe.txt
          grep -q "^ERR none" /tmp/probe.txt
          # the real protocol, with no interface: it must answer and exit cleanly
          printf 'z\nq\n' | /tmp/sxh_dmx --dir /tmp/sxapp
