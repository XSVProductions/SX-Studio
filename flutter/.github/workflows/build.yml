name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tests
        shell: pwsh
        run: |
          Push-Location packages\sx_release; dart pub get; dart test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
          Push-Location packages\sx_engine; dart pub get; dart test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
          Push-Location ui; flutter test; if ($LASTEXITCODE) { exit $LASTEXITCODE }; Pop-Location
      - name: Build Windows installer
        shell: pwsh
        run: |
          $ver = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress | Out-Null }
          ui\tool\release.ps1 -Version $ver -NoSign
      - name: Smoke test (install it, open the app, call its engine)
        shell: pwsh
        run: ui\windows\installer\smoke.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: build/windows/*.exe

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Tests
        run: |
          (cd packages/sx_engine && dart pub get && dart test)
          (cd ui && flutter test)
      - name: Build Mac installer
        run: |
          VER=0.0.0; [ "$GITHUB_REF_TYPE" = tag ] && VER="${GITHUB_REF_NAME#v}"
          bash packaging/mac/build_pkg.sh "$VER"
      - name: Smoke test (install the pkg, open the app, call its engine)
        run: bash packaging/mac/smoke.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: build/mac/*.pkg

  # live output on the Mac uses ShowXpress's own driver (efk_hardware.dylib, Intel only): check it loads and runs
  # (no interface on the build machine -> "ERR none"). Informational: never blocks a release.
  mac_live_probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Load ShowXpress's Mac interface driver
        run: |
          curl -fsSL -o /tmp/sx.dmg https://download.thelightingcontroller.com/software/V9/ShowXpress/ShowXpress_Mac.dmg
          hdiutil attach -nobrowse -readonly -mountpoint /tmp/sxv /tmp/sx.dmg
          D="$(dirname "$(find /tmp/sxv -maxdepth 4 -name efk_hardware.dylib | head -n 1)")"
          cp -R "$D" /tmp/sxapp; hdiutil detach /tmp/sxv
          ls /tmp/sxapp; lipo -archs /tmp/sxapp/efk_hardware.dylib
          [ "$(uname -m)" = arm64 ] && { softwareupdate --install-rosetta --agree-to-license >/dev/null 2>&1 || true; }
          xcrun swiftc -O -target x86_64-apple-macos10.15 packaging/mac/dmx/main.swift -o /tmp/sxh_dmx
          /tmp/sxh_dmx --dir /tmp/sxapp --probe | tee /tmp/probe.txt
          grep -q "^ERR none" /tmp/probe.txt
          # the real protocol, with no interface: it must answer and exit cleanly
          printf 'z\nq\n' | /tmp/sxh_dmx --dir /tmp/sxapp

  # No release job: the maintainer signs release.json on their own computer with the release key, which never
  # goes to GitHub. They take the Mac .pkg from this run's "mac" artifact. See RELEASE_SETUP.md.
